name: Deploy Documentation

on:
  push:
    branches:
      - develop
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Docs version to publish (e.g. 0.5, dev)"
        required: true
      alias:
        description: "Alias to point at it (e.g. latest). Leave empty for none."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: "docs-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # mike stores every published version as a commit on gh-pages, so the
      # branch must be present locally or previous versions get clobbered.
      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages --depth=1 || echo "gh-pages does not exist yet"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs Material and mike
        run: pip install mkdocs-material "mike>=2.1"

      - name: Resolve docs version and alias
        id: target
        run: |
          REF="${{ github.ref }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            ALIAS="${{ inputs.alias }}"
          elif [ "$REF" = "refs/heads/develop" ]; then
            VERSION="dev"
            ALIAS=""
          else
            TAG="${REF#refs/tags/}"
            # Stable releases only: pre-release tags (-alpha, -rcN, ...) are
            # already covered by the "dev" docs built from develop.
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Skipping pre-release tag $TAG"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # v0.5.3 -> docs version "0.5": patch releases overwrite the minor.
            VERSION="$(echo "${TAG#v}" | cut -d. -f1,2)"
            ALIAS="latest"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "Publishing docs version '$VERSION' alias '$ALIAS'"

      - name: Configure git identity
        if: steps.target.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy versioned documentation
        if: steps.target.outputs.skip == 'false'
        run: |
          mike deploy --push --update-aliases \
            "${{ steps.target.outputs.version }}" \
            ${{ steps.target.outputs.alias }}

      - name: Point site root at the latest release
        if: steps.target.outputs.alias == 'latest'
        run: mike set-default --push latest
