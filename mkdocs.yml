site_name: UELer
site_description: Unified Exploratory Linked Viewer for Spatial Proteomics
site_author: Yu-Le Wu (Hartmann Lab, DKFZ)
site_url: https://hartmannlab.github.io/UELer/
repo_url: https://github.com/HartmannLab/UELer
repo_name: HartmannLab/UELer
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
  logo: img/UELer_icon_gw.png

plugins:
  - search
  - mike:
      alias_type: symlink
      canonical_version: latest

markdown_extensions:
  - admonition
  - pymdownx.details
  # Routing the `mermaid` fence to superfences is all Material needs to render
  # diagrams: it ships the integration itself (>= 8.2), emits only a
  # `<div class="mermaid">` at build time, activates it only on pages that
  # contain a diagram, and re-renders on the light/dark toggle so the diagram
  # follows the palette. Do not add a CDN script tag or a third-party mermaid
  # plugin — either one fights the built-in integration.
  #
  # Caveat: Material's loader fetches mermaid 11 from unpkg.com at *runtime*, so
  # a diagram is blank for a reader with no network access to that host. Keep
  # diagrams for explanation, never as the only place a fact is stated.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Get Started: getting-started.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Essentials:
          - Basic Usage: tutorials/basic-usage.md
          - User Interface: tutorials/user-interface.md
          - Display Settings: tutorials/display-settings.md
          - Regions of Interest: tutorials/roi-manager.md
          - Map Mode: tutorials/map-mode.md
          - Batch Export: tutorials/export.md
      - Single-Cell Analysis:
          - Working with a Cell Table: tutorials/cell-table.md
          - Scatter & Histogram: tutorials/scatter-histogram.md
          - Clustering & Annotation: tutorials/clustering-annotation.md
  - FAQ: faq.md
  - Developer Notes:
      - Overview: develop-notes/index.md
      - Packaging & Project: develop-notes/packaging.md
      - Plugin Development: develop-notes/plugin-development.md
      - Viewer Runtime & UI: develop-notes/viewer-runtime.md
      - Mask Rendering & Coloring: develop-notes/mask-rendering.md
      - Map Mode Internals: develop-notes/map-mode.md
      - Export Pipeline: develop-notes/export-pipeline.md
      - ROI Workflows: develop-notes/roi-gallery.md
      - Heatmap & Cell Annotation: develop-notes/heatmap.md
      - OME-TIFF Loading: develop-notes/ome-tiff.md
extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
    default: latest